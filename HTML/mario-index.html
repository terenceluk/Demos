<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        .game-container { text-align: center; }
        #gameCanvas {
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .score-board {
            background: rgba(255,255,255,0.9);
            padding: 15px 30px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: inline-block;
        }
        .score-board h1 { color: #e74c3c; font-size: 24px; margin-bottom: 5px; }
        .score-board p { color: #2c3e50; font-size: 18px; font-weight: bold; }
        .controls {
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 15px;
            color: #34495e;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <h1>🏎️ Mario Kart Clone 🏁</h1>
            <p>Lap: <span id="lapDisplay">0</span>/3 | Coins: <span id="coinDisplay">0</span></p>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="controls">Use ⬆️⬇️ to accelerate/brake | ⬅️➡️ to steer</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lapDisplay = document.getElementById('lapDisplay');
        const coinDisplay = document.getElementById('coinDisplay');

        // Game state
        let coinsCollected = 0;
        let lapsCompleted = 0;
        let gameRunning = true;
        
        // Audio context for sound effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            switch(type) {
                case 'coin':
                    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(1800, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'crash':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'lap':
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.4);
                    break;
            }
        }

        // Track definition - points forming a race track loop
        const trackPoints = [
            {x: 100, y: 300}, {x: 200, y: 300}, {x: 350, y: 300},
            {x: 500, y: 300}, {x: 650, y: 300}, {x: 700, y: 250},
            {x: 700, y: 150}, {x: 650, y: 100}, {x: 500, y: 100},
            {x: 350, y: 100}, {x: 200, y: 100}, {x: 100, y: 150},
            {x: 50, y: 250}, {x: 50, y: 350}, {x: 100, y: 450},
            {x: 250, y: 500}, {x: 400, y: 500}, {x: 550, y: 500},
            {x: 700, y: 450}, {x: 750, y: 350}, {x: 750, y: 250}
        ];

        // Player kart
        const player = {
            x: trackPoints[0].x,
            y: trackPoints[0].y,
            angle: Math.PI / 2,
            speed: 0,
            maxSpeed: 6,
            acceleration: 0.15,
            friction: 0.97,
            turnSpeed: 0.06,
            width: 30,
            height: 50
        };

        // Coins on track
        const coins = [];
        for (let i = 0; i < 12; i++) {
            const idx = Math.floor((i * trackPoints.length) / 12);
            coins.push({
                x: trackPoints[idx].x,
                y: trackPoints[idx].y,
                radius: 12,
                collected: false,
                pulse: Math.random() * Math.PI * 2
            });
        }

        // Checkpoints for lap counting
        const checkpoints = [0.25, 0.5, 0.75];
        let passedCheckpoints = [];

        // Keyboard input
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        
        document.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = true;
                e.preventDefault();
            }
            if ((e.key === 'ArrowUp' || e.key === 'Enter') && !gameRunning) {
                resetGame();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // Camera follow point
        let camX = player.x, camY = player.y;

        function updatePlayer() {
            if (keys.ArrowUp) player.speed += player.acceleration;
            if (keys.ArrowDown) player.speed -= player.acceleration;
            
            // Steering only when moving
            if (Math.abs(player.speed) > 0.1) {
                const dir = player.speed > 0 ? 1 : -1;
                if (keys.ArrowLeft) player.angle -= player.turnSpeed * dir;
                if (keys.ArrowRight) player.angle += player.turnSpeed * dir;
            }
            
            // Apply friction
            player.speed *= player.friction;
            player.speed = Math.max(-player.maxSpeed, Math.min(player.maxSpeed, player.speed));
            
            // Update position
            player.x += Math.sin(player.angle) * player.speed;
            player.y -= Math.cos(player.angle) * player.speed;

            // Camera follow
            camX = player.x;
            camY = player.y;
        }

        function isOnTrack(x, y) {
            let minDist = Infinity;
            for (let i = 0; i < trackPoints.length; i++) {
                const next = (i + 1) % trackPoints.length;
                const dist = pointToLineDistance(x, y, trackPoints[i].x, trackPoints[i].y, 
                                                  trackPoints[next].x, trackPoints[next].y);
                minDist = Math.min(minDist, dist);
            }
            return minDist < 80; // Track width tolerance
        }

        function pointToLineDistance(px, py, x1, y1, x2, y2) {
            const A = px - x1;
            const B = py - y1;
            const C = x2 - x1;
            const D = y2 - y1;
            
            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;
            
            if (lenSq !== 0) param = dot / lenSq;
            
            let xx, yy;
            
            if (param < 0) { xx = x1; yy = y1; }
            else if (param > 1) { xx = x2; yy = y2; }
            else { xx = x1 + param * C; yy = y1 + param * D; }
            
            const dx = px - xx;
            const dy = py - yy;
            
            return Math.sqrt(dx * dx + dy * dy);
        }

        function checkCheckpoints() {
            // Find closest track point to player
            let minDist = Infinity, closestIdx = 0;
            for (let i = 0; i < trackPoints.length; i++) {
                const dist = Math.sqrt(
                    Math.pow(player.x - trackPoints[i].x, 2) + 
                    Math.pow(player.y - trackPoints[i].y, 2)
                );
                if (dist < minDist) {
                    minDist = dist;
                    closestIdx = i;
                }
            }

            // Check checkpoint progression
            for (let cp of checkpoints) {
                const cpIndex = Math.floor(cp * trackPoints.length);
                if (!passedCheckpoints.includes(cpIndex) && 
                    Math.abs(closestIdx - cpIndex) < 3) {
                    passedCheckpoints.push(cpIndex);
                    
                    if (passedCheckpoints.length === checkpoints.length) {
                        // Completed lap
                        lapsCompleted++;
                        playSound('lap');
                        
                        if (lapsCompleted >= 3) {
                            gameRunning = false;
                        } else {
                            passedCheckpoints = [];
                        }
                    }
                }
            }
        }

        function checkCoinCollection() {
            for (let coin of coins) {
                if (!coin.collected) {
                    const dx = player.x - coin.x;
                    const dy = player.y - coin.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 40) {
                        coin.collected = true;
                        coinsCollected++;
                        playSound('coin');
                        
                        // Respawn after delay
                        setTimeout(() => {
                            const idx = Math.floor(Math.random() * trackPoints.length);
                            coin.x = trackPoints[idx].x;
                            coin.y = trackPoints[idx].y;
                            coin.collected = false;
                        }, 5000);
                    }
                }
            }
        }

        function drawTrack() {
            // Grass background
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(-camX + canvas.width/2, -camY + canvas.height/2);
            
            // Draw track surface (asphalt)
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 160;
            ctx.strokeStyle = '#555';
            ctx.beginPath();
            ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
            for (let i = 1; i < trackPoints.length; i++) {
                ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
            }
            ctx.closePath();
            ctx.stroke();
            
            // Track edges (red and white stripes)
            ctx.lineWidth = 160;
            for (let offset = -5; offset <= 5; offset += 10) {
                const color = Math.abs(offset) % 20 === 5 ? '#e74c3c' : '#ecf0f1';
                ctx.strokeStyle = color;
                ctx.stroke();
            }
            
            // Center line (dashed white)
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 30]);
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Start/finish line (checkered pattern)
            ctx.save();
            ctx.translate(trackPoints[0].x, trackPoints[0].y);
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 4; j++) {
                    ctx.fillStyle = (i + j) % 2 === 0 ? '#000' : '#fff';
                    ctx.fillRect(-5 + i * 10, -60 + j * 30, 10, 30);
                }
            }
            ctx.restore();
            
            // Checkpoint markers (green when passed)
            checkpoints.forEach((cp, idx) => {
                const cpIdx = Math.floor(cp * trackPoints.length);
                const x = trackPoints[cpIdx].x;
                const y = trackPoints[cpIdx].y;
                
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2);
                ctx.fillStyle = passedCheckpoints.includes(cpIdx) ? '#2ecc71' : 'rgba(231, 76, 60, 0.5)';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
            
            ctx.restore();
        }

        function drawCoins() {
            for (let coin of coins) {
                if (!coin.collected) {
                    // Pulse effect
                    const pulseSize = Math.sin(coin.pulse) * 3;
                    
                    // Glow
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.radius + 8 + pulseSize, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(241, 196, 15, 0.3)';
                    ctx.fill();
                    
                    // Coin body with gradient
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                    const grad = ctx.createRadialGradient(coin.x - 4, coin.y - 4, 0, coin.x, coin.y, coin.radius);
                    grad.addColorStop(0, '#f1c40f');
                    grad.addColorStop(1, '#f39c12');
                    ctx.fillStyle = grad;
                    ctx.fill();
                    
                    // Border
                    ctx.strokeStyle = '#e67e22';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Dollar sign
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 18px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('$', coin.x, coin.y);
                }
            }
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.fillRect(-player.width/2 + 5, -player.height/2 + 5, player.width, player.height);
            
            // Kart body (red kart like Mario's)
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(-player.width/2, -player.height/2, player.width, player.height, 8) : 
                ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);
            ctx.fill();
            
            // Kart details (darker red center)
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(-player.width/2 + 5, -player.height/2 + 10, player.width - 10, player.height - 20);
            
            // Driver (Mario-style character)
            // Hat brim
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(-16, -12, 32, 6);
            // Hat top
            ctx.beginPath();
            ctx.arc(0, -8, 14, Math.PI, 0);
            ctx.fill();
            
            // Face
            ctx.beginPath();
            ctx.arc(0, -5, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#f39c12';
            ctx.fill();
            
            // Mustache
            ctx.beginPath();
            ctx.ellipse(4, -2, 6, 3, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#000';
            ctx.fill();
            
            // Wheels (black)
            ctx.fillStyle = '#2c3e50';
            const wheelWidth = 8;
            const wheelHeight = 14;
            ctx.fillRect(-player.width/2 - 2, -player.height/2 + 3, wheelWidth, wheelHeight);
            ctx.fillRect(player.width/2 - 6, -player.height/2 + 3, wheelWidth, wheelHeight);
            ctx.fillRect(-player.width/2 - 2, player.height/2 - 17, wheelWidth, wheelHeight);
            ctx.fillRect(player.width/2 - 6, player.height/2 - 17, wheelWidth, wheelHeight);
            
            // Wheel hubs (silver)
            ctx.fillStyle = '#95a5a6';
            const drawWheelHub = (wx, wy) => {
                ctx.beginPath();
                ctx.arc(wx, wy, 4, 0, Math.PI * 2);
                ctx.fill();
            };
            drawWheelHub(-player.width/2 + 2, -player.height/2 + 10);
            drawWheelHub(player.width/2 - 4, -player.height/2 + 10);
            drawWheelHub(-player.width/2 + 2, player.height/2 - 10);
            drawWheelHub(player.width/2 - 4, player.height/2 - 10);
            
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw track and objects with camera offset
            ctx.save();
            ctx.translate(-camX + canvas.width/2, -camY + canvas.height/2);
            
            drawTrack();
            drawCoins();
            drawPlayer();
            
            ctx.restore();
            
            // Game over screen
            if (!gameRunning) {
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('🏆 RACE COMPLETE! 🏆', canvas.width/2, canvas.height/2 - 50);
                
                ctx.fillStyle = '#fff';
                ctx.font = '32px Arial';
                ctx.fillText(`Coins Collected: ${coinsCollected}`, canvas.width/2, canvas.height/2 + 10);
                
                ctx.font = '24px Arial';
                ctx.fillStyle = '#bdc3c7';
                ctx.fillText('Press UP Arrow or Enter to Play Again', canvas.width/2, canvas.height/2 + 60);
            }
        }

        function update() {
            if (gameRunning) {
                updatePlayer();
                checkCheckpoints();
                checkCoinCollection();
                
                // Update coin pulse animation
                coins.forEach(coin => {
                    if (!coin.collected) coin.pulse += 0.1;
                });
            }
        }

        function resetGame() {
            player.x = trackPoints[0].x;
            player.y = trackPoints[0].y;
            player.angle = Math.PI / 2;
            player.speed = 0;
            
            coinsCollected = 0;
            lapsCompleted = 0;
            passedCheckpoints = [];
            
            // Respawn all coins
            for (let i = 0; i < coins.length; i++) {
                const idx = Math.floor((i * trackPoints.length) / coins.length);
                coins[i].x = trackPoints[idx].x;
                coins[i].y = trackPoints[idx].y;
                coins[i].collected = false;
            }
            
            gameRunning = true;
        }

        function updateDisplay() {
            lapDisplay.textContent = lapsCompleted;
            coinDisplay.textContent = coinsCollected;
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            updateDisplay();
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
