<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding - Crisp Planets Demo</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
            backdrop-filter: blur(5px);
            font-weight: bold;
            letter-spacing: 1px;
        }
        .controls-note {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="info">
        ✨ VIBE CODING DEMO • <span style="color: #ffaa44;">CRISP PLANETS</span> • Drag to rotate
    </div>
    <div class="controls-note">
        🖱️ Mouse drag to orbit • Scroll to zoom
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // --- Setup Scene ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 6, 14);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);
        
        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.8;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.enablePan = false;
        controls.target.set(0, 0, 0);
        
        // --- Starfield ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 800;
            starPositions[i*3+1] = (Math.random() - 0.5) * 600;
            starPositions[i*3+2] = (Math.random() - 0.5) * 300 - 100;
            
            const colorChoice = Math.random();
            if (colorChoice > 0.8) {
                starColors[i*3] = 1.0;
                starColors[i*3+1] = 0.8;
                starColors[i*3+2] = 0.5;
            } else if (colorChoice > 0.6) {
                starColors[i*3] = 0.6;
                starColors[i*3+1] = 0.7;
                starColors[i*3+2] = 1.0;
            } else {
                starColors[i*3] = 1.0;
                starColors[i*3+1] = 1.0;
                starColors[i*3+2] = 1.0;
            }
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        const starMaterial = new THREE.PointsMaterial({ size: 0.25, vertexColors: true, transparent: false });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x111122);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
        mainLight.position.set(5, 8, 4);
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x88aaff, 0.5);
        fillLight.position.set(2, 3, 5);
        scene.add(fillLight);
        
        const rimLight = new THREE.PointLight(0xffaa66, 0.6);
        rimLight.position.set(-3, 2, -6);
        scene.add(rimLight);
        
        const bottomLight = new THREE.PointLight(0x6644aa, 0.4);
        bottomLight.position.set(0, -4, 0);
        scene.add(bottomLight);
        
        const sunLight = new THREE.PointLight(0xffaa66, 1.8, 25);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);
        
        // --- Sun ---
        const sunGeometry = new THREE.SphereGeometry(1.3, 128, 128);
        const sunMaterial = new THREE.MeshStandardMaterial({
            color: 0xff8844,
            emissive: 0xff4422,
            emissiveIntensity: 0.9,
            metalness: 0.1,
            roughness: 0.2
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);
        
        // --- Planets ---
        const planets = [];
        
        function addPlanet(name, radius, color, distance, speed, emissiveColor = 0x000000, emissiveIntensity = 0) {
            const geometry = new THREE.SphereGeometry(radius, 96, 96);
            const material = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.3,
                metalness: 0.4,
                emissive: emissiveColor,
                emissiveIntensity: emissiveIntensity
            });
            const planet = new THREE.Mesh(geometry, material);
            
            planet.userData = {
                distance: distance,
                speed: speed,
                angle: Math.random() * Math.PI * 2
            };
            
            scene.add(planet);
            
            if (name === "Saturn") {
                const ringGeo = new THREE.TorusGeometry(radius * 1.4, radius * 0.25, 64, 200);
                const ringMat = new THREE.MeshStandardMaterial({ color: 0xd4b87a, metalness: 0.6, roughness: 0.4 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.2;
                ring.rotation.z = 0.4;
                planet.add(ring);
            }
            
            planets.push(planet);
            return planet;
        }
        
        addPlanet("Mercury", 0.30, 0xdaa06a, 2.3, 0.022);
        addPlanet("Venus",   0.37, 0xe8b86b, 3.1, 0.018);
        addPlanet("Earth",   0.40, 0x4c9aff, 3.9, 0.015);
        addPlanet("Mars",    0.34, 0xe07040, 4.7, 0.013);
        addPlanet("Jupiter", 0.82, 0xd4a574, 6.2, 0.009, 0x442200, 0.12);
        addPlanet("Saturn",  0.72, 0xf0cf8c, 7.5, 0.0075, 0x331100, 0.08);
        addPlanet("Uranus",  0.58, 0x7ec8e0, 8.8, 0.006);
        addPlanet("Neptune", 0.57, 0x4a6eff, 10.0, 0.005);
        
        // --- Orbit Lines ---
        const orbitDistances = [2.3, 3.1, 3.9, 4.7, 6.2, 7.5, 8.8, 10.0];
        orbitDistances.forEach(distance => {
            const points = [];
            const segments = 128;
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                const x = Math.cos(angle) * distance;
                const z = Math.sin(angle) * distance;
                points.push(new THREE.Vector3(x, 0, z));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const orbitMaterialLine = new THREE.LineBasicMaterial({ color: 0x44ccff, transparent: true, opacity: 0.35 });
            const orbitLine = new THREE.LineLoop(geometry, orbitMaterialLine);
            scene.add(orbitLine);
        });
        
        // --- Asteroid Belt ---
        const asteroidCount = 800;
        const asteroidGeo = new THREE.BufferGeometry();
        const asteroidPositions = new Float32Array(asteroidCount * 3);
        for (let i = 0; i < asteroidCount; i++) {
            const radius = 5.2 + Math.random() * 0.8;
            const angle = Math.random() * Math.PI * 2;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            asteroidPositions[i*3] = x + (Math.random() - 0.5) * 0.3;
            asteroidPositions[i*3+1] = (Math.random() - 0.5) * 0.4;
            asteroidPositions[i*3+2] = z + (Math.random() - 0.5) * 0.3;
        }
        asteroidGeo.setAttribute('position', new THREE.BufferAttribute(asteroidPositions, 3));
        const asteroidMat = new THREE.PointsMaterial({ color: 0xaa9977, size: 0.04 });
        const asteroidField = new THREE.Points(asteroidGeo, asteroidMat);
        scene.add(asteroidField);
        
        // --- Animation ---
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            planets.forEach((planet, idx) => {
                const data = planet.userData;
                if (data) {
                    data.angle += data.speed;
                    const x = Math.cos(data.angle) * data.distance;
                    const z = Math.sin(data.angle) * data.distance;
                    planet.position.set(x, 0, z);
                    
                    if (idx === 3 || idx === 5) {
                        planet.position.y = Math.sin(data.angle * 2) * 0.08;
                    }
                }
            });
            
            stars.rotation.y += 0.0003;
            stars.rotation.x += 0.0002;
            
            const intensity = 1.7 + Math.sin(time * 3) * 0.2;
            sunLight.intensity = intensity;
            sunMaterial.emissiveIntensity = 0.8 + Math.sin(time * 4) * 0.15;
            
            asteroidField.rotation.y += 0.002;
            
            rimLight.position.x = -3 + Math.sin(time * 0.5) * 1;
            rimLight.intensity = 0.6 + Math.sin(time * 1.2) * 0.2;
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        console.log('Crisp Planets Demo Ready!');
    </script>
</body>
</html>
